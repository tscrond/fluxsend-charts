images:
  backend: fluxsend-backend:1.0.4
  frontend: fluxsend-frontend:1.0.4

namespace: "default"

appName: "fluxsend"
replicas: 1
mailFrom: "noreply@fluxsend.com"
labels: {}
# here specify:
# podDisruptionBudget:
#   minAvailable: <your_number>
# or
# podDisruptionBudget:
#   maxUnavailable: <your_number>
podDisruptionBudget:
  maxUnavailable: null
  minAvailable: null

cloudFront:
  enabled: false
  domain: "changeme"
  keyPairId: "changeme"
  secretName: "changeme"

ingress:
  ingressClassName: haproxy
  annotations: {}
  tls:
    secretName: "changeme"
  hosts:
    - hostname: "changeme.changeme"
      servicePort: "3000"

params:
  frontendEndpoint: "__CHANGE_ME__"
  backendEndpoint: "__CHANGE_ME__"

secrets:
  storage:
    # s3 or gcs
    type: "s3"
    storageSecretName: "changeme"

  dbSecretName: "changeme"
  smtpSecretName: "changeme"
  oauthSecretName: "changeme"

migrate:
  legacyS3PrefixMigration: false
